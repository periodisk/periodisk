name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Periodisk
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Validate scientific data
        run: python -m periodisk validate --release

      - name: Run tests
        run: python -m pytest
